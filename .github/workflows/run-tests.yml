name: Run Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'cinema-booking-system/frontend/**'
      - 'cinema-booking-system/backend_legacy/**'
      - 'cinema-booking-system/backend/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'cinema-booking-system/frontend/**'
      - 'cinema-booking-system/backend_legacy/**'
      - 'cinema-booking-system/backend/**'
  workflow_dispatch:
jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      backend_legacy: ${{ steps.filter.outputs.backend_legacy }}
      backend: ${{ steps.filter.outputs.backend }}
      ai_chatbot: ${{ steps.filter.outputs.ai_chatbot }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_legacy:
              - 'cinema-booking-system/backend_legacy/**'
            backend:
              - 'cinema-booking-system/backend/**'
            ai_chatbot:
              - 'cinema-booking-system/backend/services/ai-chatbot-service/**'
            frontend:
              - 'cinema-booking-system/frontend/**'

  backend-legacy-tests:
    name: Legacy backend unit tests
    needs: changes
    if: ${{ needs.changes.outputs.backend_legacy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run backend tests
        working-directory: cinema-booking-system/backend_legacy
        run: mvn test

  backend-tests:
    name: Spring backend verification
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Verify Spring service reactor
        working-directory: cinema-booking-system/backend
        run: mvn --batch-mode clean verify

      - name: Validate runtime and migration scripts
        shell: pwsh
        working-directory: cinema-booking-system/backend
        run: |
          $parseFailures = @()
          Get-ChildItem infrastructure -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $parseFailures += "$($_.FullName): $($errors -join '; ')"
            }
          }
          if ($parseFailures.Count -gt 0) {
            throw "PowerShell parse failures:`n$($parseFailures -join "`n")"
          }
          if (-not (Test-Path "infrastructure/.env") -and (Test-Path "infrastructure/.env.example")) {
            Copy-Item "infrastructure/.env.example" "infrastructure/.env"
          }
          docker compose -f infrastructure/docker-compose.yml config --quiet
          docker compose -f infrastructure/docker-compose.migration-rehearsal.yml config --quiet
          ./infrastructure/smoke-test.ps1 -ValidateOnly
          ./infrastructure/event-flow-smoke.ps1 -ValidateOnly
          ./infrastructure/migrations/export-legacy-data.ps1 -DryRun
          ./infrastructure/migrations/restore-service-data.ps1 -DryRun
          ./infrastructure/migrations/verify-service-counts.ps1 -DryRun
          ./infrastructure/migrations/backfill-analytics-read-model.ps1 -DryRun

  backend-event-flow:
    name: Spring event-flow integration
    needs:
      - changes
      - backend-tests
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Seed test environment
        shell: pwsh
        working-directory: cinema-booking-system/backend
        run: |
          if (-not (Test-Path "infrastructure/.env") -and (Test-Path "infrastructure/.env.example")) {
            Copy-Item "infrastructure/.env.example" "infrastructure/.env"
          }

      - name: Verify RabbitMQ projections and ordering
        shell: pwsh
        working-directory: cinema-booking-system/backend
        run: ./infrastructure/event-flow-smoke.ps1 -StartCompose -StopCompose -TimeoutSeconds 180

      - name: Capture service diagnostics
        if: failure()
        working-directory: cinema-booking-system/backend
        run: |
          docker compose -f infrastructure/docker-compose.yml ps
          docker compose -f infrastructure/docker-compose.yml logs --no-color --tail=200

      - name: Ensure stack teardown
        if: always()
        working-directory: cinema-booking-system/backend
        run: docker compose -f infrastructure/docker-compose.yml down --remove-orphans

  ai-chatbot-tests:
    name: AI Chatbot verification
    needs: changes
    if: ${{ needs.changes.outputs.ai_chatbot == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "cinema-booking-system/backend/services/ai-chatbot-service/requirements*.txt"

      - name: Install dependencies
        working-directory: cinema-booking-system/backend/services/ai-chatbot-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit and keyless integration tests
        working-directory: cinema-booking-system/backend/services/ai-chatbot-service
        run: pytest -v

      - name: Run pgvector and Redis container tests
        working-directory: cinema-booking-system/backend/services/ai-chatbot-service
        run: pytest -v -m containers

      - name: Build Docker image
        working-directory: cinema-booking-system/backend
        run: docker build --file services/ai-chatbot-service/Dockerfile --tag ai-chatbot-service:ci .
