name: Run Build

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'cinema-booking-system/frontend/**'
      - 'cinema-booking-system/backend/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'cinema-booking-system/frontend/**'
      - 'cinema-booking-system/backend/**'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'cinema-booking-system/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: cinema-booking-system/frontend
        run: |
          rm -f package-lock.json
          npm install

      - name: Build frontend
        working-directory: cinema-booking-system/frontend
        run: npm run build

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend
        working-directory: cinema-booking-system/backend
        run: mvn clean package -DskipTests
