spring:
  datasource:
    url: jdbc:h2:mem:chatbot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

cinema:
  ai:
    enabled: false
    api-key: ""
  security:
    jwt:
      enabled: false
  chatbot:
    reindex-on-startup: false
    tenant-id: 11111111-1111-1111-1111-111111111111
    max-distance: 0.55

app:
  internal-token: test-token

services:
  catalog:
    url: http://127.0.0.1:9
  showtime:
    url: http://127.0.0.1:9
  booking:
    url: http://127.0.0.1:9
  recommendation:
    url: http://127.0.0.1:9
