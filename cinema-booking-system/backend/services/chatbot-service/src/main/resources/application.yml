server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: chatbot-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinema_chatbot_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:
  internal-token: ${INTERNAL_API_TOKEN:local-dev-internal-token}

cinema:
  security:
    jwt:
      enabled: ${CINEMA_SECURITY_JWT_ENABLED:false}
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      audience: ${KEYCLOAK_AUDIENCE:cinema-api}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
  ai:
    enabled: ${CINEMA_AI_ENABLED:false}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    timeout: ${GEMINI_TIMEOUT:30s}
  chatbot:
    tenant-id: ${CHATBOT_TENANT_ID:00000000-0000-0000-0000-000000000001}
    top-k: 5
    max-distance: ${CHATBOT_MAX_DISTANCE:0.40}
    relative-margin: ${CHATBOT_RELATIVE_MARGIN:0.08}
    citation-max-chars: 500
    history-messages: 10
    history-chars: 4000
    reindex-on-startup: ${CHATBOT_REINDEX_ON_STARTUP:true}
    dev-actor-id: 0

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  showtime:
    url: ${SHOWTIME_SERVICE_URL:http://localhost:8082}
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  recommendation:
    url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8085}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
