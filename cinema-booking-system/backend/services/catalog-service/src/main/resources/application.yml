server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinema_catalog_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  internal-token: ${INTERNAL_API_TOKEN:local-dev-internal-token}

cinema:
  security:
    jwt:
      enabled: ${CINEMA_SECURITY_JWT_ENABLED:false}
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      audience: ${KEYCLOAK_AUDIENCE:cinema-api}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

services:
  showtime:
    url: ${SHOWTIME_SERVICE_URL:http://localhost:8082}

outbox:
  dispatcher:
    enabled: ${OUTBOX_DISPATCHER_ENABLED:false}
    fixed-delay-ms: ${OUTBOX_DISPATCHER_FIXED_DELAY_MS:5000}
    batch-size: ${OUTBOX_DISPATCHER_BATCH_SIZE:50}
    confirm-timeout: ${OUTBOX_DISPATCHER_CONFIRM_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
