server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: rental-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinema_rental_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    defer-datasource-initialization: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

app:
  internal-token: ${INTERNAL_API_TOKEN:local-dev-internal-token}

cinema:
  security:
    jwt:
      enabled: ${CINEMA_SECURITY_JWT_ENABLED:false}
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      audience: ${KEYCLOAK_AUDIENCE:cinema-api}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

services:
  facility:
    url: ${FACILITY_SERVICE_URL:http://localhost:5002}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  showtime:
    url: ${SHOWTIME_SERVICE_URL:http://localhost:8082}
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:5001}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
