server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: rental-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinema_rental_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    defer-datasource-initialization: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

app:
  internal-token: ${INTERNAL_API_TOKEN:local-dev-internal-token}
  rental:
    zone: ${APP_RENTAL_ZONE:Asia/Ho_Chi_Minh}
    turnover-minutes: ${APP_RENTAL_TURNOVER_MINUTES:15}
    customer-cancel-hours: ${APP_RENTAL_CUSTOMER_CANCEL_HOURS:24}
    default-price-per-hour: ${APP_RENTAL_DEFAULT_PRICE_PER_HOUR:150000}
    weekend-multiplier: ${APP_RENTAL_WEEKEND_MULTIPLIER:1.5}
    peak-multiplier: ${APP_RENTAL_PEAK_MULTIPLIER:1.2}
    peak-start-hour: ${APP_RENTAL_PEAK_START_HOUR:18}
    peak-end-hour: ${APP_RENTAL_PEAK_END_HOUR:22}

cinema:
  security:
    jwt:
      enabled: ${CINEMA_SECURITY_JWT_ENABLED:false}
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      audience: ${KEYCLOAK_AUDIENCE:cinema-api}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

services:
  facility:
    url: ${FACILITY_SERVICE_URL:http://localhost:5002}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  showtime:
    url: ${SHOWTIME_SERVICE_URL:http://localhost:8082}
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:5001}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:5004}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
