spring:
  datasource:
    url: jdbc:h2:mem:rental;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
  sql:
    init:
      mode: never

cinema:
  security:
    jwt:
      enabled: false
