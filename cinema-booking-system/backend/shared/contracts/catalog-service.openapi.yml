openapi: 3.0.3
info:
  title: Cinema Catalog Service API
  version: 0.1.0
  description: Draft contract for the extracted Catalog service.
servers:
  - url: http://localhost:8081
paths:
  /actuator/health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy.
  /api/catalog/search:
    get:
      summary: Search movies and events
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: genreId
          in: query
          schema:
            type: integer
            format: int64
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            enum: [SHOWING, UPCOMING, ALL]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Search result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchApiResponse"
  /internal/catalog/movies/features:
    get:
      summary: Movie features used by the uncertainty recommendation algorithm.
      security:
        - internalToken: []
      responses:
        "200":
          description: Feature rows for every movie.
  /internal/catalog/movies/{movieId}/feature:
    get:
      summary: One movie feature row.
      security:
        - internalToken: []
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Feature row.
  /api/movies/imdb/titles:
    get:
      summary: Search IMDb titles without writing the catalog.
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: IMDb title list.
  /api/movies/imdb-sync/{imdbId}:
    post:
      summary: Upsert one movie from IMDb.
      security:
        - bearerAuth: []
      parameters:
        - name: imdbId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upserted movie.
  /api/movies/bulk-import:
    post:
      summary: Start a background IMDb import for one genre.
      security:
        - bearerAuth: []
      parameters:
        - name: genre
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "202":
          description: Import accepted.
  /internal/catalog/movies/{movieId}:
    get:
      summary: Internal movie projection for Showtime
      security:
        - internalToken: []
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Movie projection.
  /internal/catalog/events/{eventId}:
    get:
      summary: Internal event projection for Showtime
      security:
        - internalToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Event projection.
  /api/movies:
    get:
      summary: List active movies
      responses:
        "200":
          description: Active movies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieListApiResponse"
    post:
      summary: Create movie
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieRequest"
      responses:
        "200":
          description: Created movie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieApiResponse"
  /api/movies/{id}:
    get:
      summary: Get movie by id
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Movie details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieApiResponse"
    put:
      summary: Update movie
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieRequest"
      responses:
        "200":
          description: Updated movie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieApiResponse"
    delete:
      summary: Soft delete movie
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted movie.
  /api/events:
    get:
      summary: List upcoming events
      responses:
        "200":
          description: Upcoming events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListApiResponse"
    post:
      summary: Create event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
      responses:
        "200":
          description: Created event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventApiResponse"
  /api/events/all:
    get:
      summary: List all events
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListApiResponse"
  /api/events/{id}:
    get:
      summary: Get event by id
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Event details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventApiResponse"
    delete:
      summary: Soft delete event
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted event.
  /api/genres:
    get:
      summary: List genres
      responses:
        "200":
          description: Genres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreListApiResponse"
    post:
      summary: Create genre
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenreRequest"
      responses:
        "200":
          description: Created genre.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreApiResponse"
  /api/genres/{id}:
    delete:
      summary: Delete genre
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted genre.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        message:
          type: string
        data:
          nullable: true
    MovieRequest:
      type: object
      required:
        - title
        - durationMinutes
      properties:
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        releaseDate:
          type: string
          format: date
        ageRating:
          type: string
        posterUrl:
          type: string
        trailerUrl:
          type: string
        language:
          type: string
        imdbId:
          type: string
        imdbRating:
          type: number
        region:
          type: string
        director:
          type: string
        actors:
          type: string
        active:
          type: boolean
          default: true
        genreIds:
          type: array
          items:
            type: integer
            format: int64
    MovieResponse:
      allOf:
        - $ref: "#/components/schemas/MovieRequest"
        - type: object
          properties:
            id:
              type: integer
              format: int64
            genres:
              type: array
              items:
                type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            aiSummary:
              type: string
              nullable: true
              description: Short summary generated by catalog after the movie is saved. Clients cannot set this field.
    EventRequest:
      type: object
      required:
        - name
        - roomId
        - basePrice
      properties:
        name:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        venue:
          type: string
        imageUrl:
          type: string
        active:
          type: boolean
          default: true
        roomId:
          type: integer
          format: int64
        basePrice:
          type: number
    EventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        venue:
          type: string
        imageUrl:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GenreRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    GenreResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    CatalogSearchResponse:
      type: object
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/MovieResponse"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        movieTotalPages:
          type: integer
        eventTotalPages:
          type: integer
        movieTotalElements:
          type: integer
          format: int64
        eventTotalElements:
          type: integer
          format: int64
    MovieApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MovieResponse"
    MovieListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/MovieResponse"
    EventApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/EventResponse"
    EventListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/EventResponse"
    GenreApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/GenreResponse"
    GenreListApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/GenreResponse"
    CatalogSearchApiResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CatalogSearchResponse"
