openapi: 3.0.3
info:
  title: Cinema Facility Service API
  version: 0.1.0
paths:
  /api/cinemas:
    get:
      summary: Get all cinemas.
      responses:
        "200":
          description: List of cinemas.
    post:
      summary: Create a cinema.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/CreateCinemaCommand"
      responses:
        "201":
          description: Created cinema.
  /api/cinemas/{cinemaId}:
    get:
      summary: Get cinema by id.
      parameters:
        - $ref: "#/components/parameters/CinemaId"
      responses:
        "200":
          description: Cinema details.
    put:
      summary: Update a cinema.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CinemaId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateCinemaCommand"
      responses:
        "200":
          description: Cinema updated.
    delete:
      summary: Delete a cinema.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CinemaId"
      responses:
        "204":
          description: Cinema deleted.
  /api/cinemas/{cinemaId}/rooms:
    get:
      summary: Get rooms for a cinema.
      parameters:
        - $ref: "#/components/parameters/CinemaId"
      responses:
        "200":
          description: List of rooms.
    post:
      summary: Create a room.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CinemaId"
      requestBody:
        $ref: "#/components/requestBodies/CreateRoomCommand"
      responses:
        "201":
          description: Room created.
  /api/cinemas/{cinemaId}/rooms/{roomId}:
    get:
      summary: Get a room by id.
      parameters:
        - $ref: "#/components/parameters/CinemaId"
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room details.
    put:
      summary: Update a room.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CinemaId"
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        $ref: "#/components/requestBodies/UpdateRoomCommand"
      responses:
        "200":
          description: Room updated.
    delete:
      summary: Delete a room.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CinemaId"
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: Room deleted.
  /api/cinemas/{cinemaId}/rooms/{roomId}/seats:
    get:
      summary: Get seat templates.
      parameters:
        - $ref: "#/components/parameters/CinemaId"
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Seat templates.
    put:
      summary: Update seat map.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CinemaId"
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        $ref: "#/components/requestBodies/SeatMapUpdateRequestDto"
      responses:
        "200":
          description: Seat map updated.
  /internal/facility/rooms/{roomId}:
    get:
      summary: Get room details internally.
      security:
        - internalToken: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room details.
  /internal/facility/seat-templates/{seatTemplateId}:
    get:
      summary: Get a seat template internally.
      security:
        - internalToken: []
      parameters:
        - name: seatTemplateId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Seat template.
  /internal/facility/rooms/{roomId}/seat-templates:
    get:
      summary: Get seat templates for a room internally.
      security:
        - internalToken: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Seat templates.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The API Gateway intercepts the JWT, validates it against Keycloak, and injects the following headers for downstream services:
        - `X-User-Id`: Resolved internal User ID (long)
        - `X-User-Roles`: Comma-separated roles
        - `X-User-Email`: User's email
        - `X-Keycloak-Id`: Original Keycloak UUID
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
  parameters:
    CinemaId:
      name: cinemaId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBodies:
    CreateCinemaCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
    UpdateCinemaCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
    CreateRoomCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
    UpdateRoomCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
    SeatMapUpdateRequestDto:
      required: true
      content:
        application/json:
          schema:
            type: object
