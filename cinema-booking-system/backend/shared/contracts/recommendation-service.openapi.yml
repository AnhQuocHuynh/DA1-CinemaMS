openapi: 3.0.3
info:
  title: Cinema Recommendation Service API
  version: 0.1.0
paths:
  /api/recommendations/movies:
    get:
      summary: Get personalized movie recommendations.
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Personalized recommendations or fallback list.
  /api/recommendations/movies/popular:
    get:
      summary: Get globally popular movie recommendations.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Popular recommendations.
  /api/recommendations/movies/{movieId}/similar:
    get:
      summary: Get movies similar to a movie.
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Similar movie recommendations.
  /api/recommendations/users/{userId}/taste-profile:
    get:
      summary: Get a user's computed taste profile.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: User taste profile.
  /api/recommendations/top-k:
    get:
      summary: Uncertainty nearest-neighbor top-k for the current user.
      parameters:
        - name: k
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Personalized top-k list.
  /api/recommendations/predict:
    get:
      summary: Predict the current user's rating for one movie.
      parameters:
        - name: targetMovieId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Prediction with uncertainty.
  /api/recommendations/user-ratings/me:
    get:
      summary: List the current user's movie ratings.
      responses:
        "200":
          description: Ratings.
  /api/recommendations/user-ratings/me/list:
    get:
      summary: Page the current user's movie ratings.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Rating page.
  /api/recommendations/user-ratings:
    post:
      summary: Create or update the current user's rating for a movie.
      responses:
        "201":
          description: Saved rating.
  /api/recommendations/user-ratings/{movieId}:
    delete:
      summary: Delete the current user's rating for a movie.
      parameters:
        - name: movieId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Rating deleted.
  /api/recommendations/max-dissimilarity/recalculate:
    post:
      summary: Recompute the catalog-wide max movie dissimilarity.
      responses:
        "200":
          description: Recalculated.
