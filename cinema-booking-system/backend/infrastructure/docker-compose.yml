# port allocations:
#| Service | Internal Port | External (via Gateway) |
#| API Gateway  5000 | 443 (HTTPS) / 80 (HTTP) |
#| Identity Service | 5001 | — |
#| Facility Service | 5002 | — |
#| Payment Service | 5003 | — |
#| Notification Service | 5004 | — |
#| Catalog Service | 8081 | — |
#| Showtime Service | 8082 | — |
#| Booking Service | 8083 | — |
#| Analytics Service | 8084 | — |
#| Recommendation Service | 8085 | — |
#| PostgreSQL | 5432 | — |
#| Redis | 6379 | — |
#| RabbitMQ | 5672 (AMQP) / 15672 (UI) | — |
#| ClickHouse | 8123 (HTTP) / 9000 (native) | — |
#| Neo4j | 7474 (Browser) / 7687 (Bolt)
#| Keycloak | 8080 | — |

name: cinema-booking-system-backend

services:
#postgres db
  postgres: #1 instance for all dbs to reduce resource usage
    image: postgres:17-alpine
    container_name: cinema-booking-system-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cinema_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh

  #redis
  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  #rabbitmq
  rabbitmq:
    image: rabbitmq:3-management
    container_name: cinema-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"

  #keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: cinema-keycloak
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak_db
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=password
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    command: start-dev
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-themes/cinema-theme:/opt/keycloak/themes/cinema-theme
      - ./keycloak-spi/target/rabbitmq-event-listener.jar:/opt/keycloak/providers/rabbitmq-event-listener.jar
    depends_on:
      - postgres
      - rabbitmq

  #services
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: cinema-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ReverseProxy__Clusters__keycloak-cluster__Destinations__keycloak-1__Address=http://keycloak:8080
      - ReverseProxy__Clusters__user-profile-cluster__Destinations__user-profile-1__Address=http://identity-service:80
      - ReverseProxy__Clusters__facility-cluster__Destinations__facility-1__Address=http://facility-service:80
      - Jwt__Authority=http://keycloak:8080/realms/cinema-booking
      - UserProfileService__BaseUrl=http://identity-service:80
      - Redis__ConnectionString=redis:6379
    ports:
      - "5000:80"
    depends_on:
      - keycloak
      - identity-service
      - facility-service
      - redis
      
  identity-service:
    build:
      context: ../services/identity-service
      dockerfile: Dockerfile
    container_name: cinema-identity-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=user_profile_db;Username=postgres;Password=password
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    ports:
      - "5001:80"
    depends_on:
      - postgres
      - rabbitmq

  facility-service:
    build:
      context: ../services/facility-service
      dockerfile: Dockerfile
    container_name: cinema-facility-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=facility_db;Username=postgres;Password=password
    ports:
      - "5002:80"
    depends_on:
      - postgres

  

volumes:
  pgdata:
  redisdata: