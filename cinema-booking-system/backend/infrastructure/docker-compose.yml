# port allocations:
#| Service | Internal Port | External (via Gateway) |
#| API Gateway  5000 | 443 (HTTPS) / 80 (HTTP) |
#| Identity Service | 5001 | — |
#| Facility Service | 5002 | — |
#| Payment Service | 5003 | — |
#| Notification Service | 5004 | — |
#| Catalog Service | 8081 | — |
#| Showtime Service | 8082 | — |
#| Booking Service | 8083 | — |
#| Analytics Service | 8084 | — |
#| Recommendation Service | 8085 | — |
#| PostgreSQL | 5432 | — |
#| Redis | 6379 | — |
#| RabbitMQ | 5672 (AMQP) / 15672 (UI) | — |
#| ClickHouse | 8123 (HTTP) / 9000 (native) | — |
#| Neo4j | 7474 (Browser) / 7687 (Bolt)
#| Keycloak | 8080 | — |

name: cinema-booking-system-backend

# Note: Docker Compose automatically loads environment variables from ./.env

services:
#postgres db
  postgres: #1 instance for all dbs to reduce resource usage
    image: postgres:17-alpine
    container_name: cinema-booking-system-db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh

  #redis
  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data

  #rabbitmq
  rabbitmq:
    image: rabbitmq:3-management
    container_name: cinema-rabbitmq
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  #keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: cinema-keycloak
    env_file:
      - .env
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_BOOTSTRAP_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD}
      - KC_DB=${KC_DB_TYPE}
      - KC_DB_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${KEYCLOAK_DB_NAME}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    command: start-dev --import-realm
    ports:
      - "${KC_PORT}:8080"
    volumes:
      - ./keycloak-themes/cinema-theme:/opt/keycloak/themes/cinema-theme
      - ./keycloak-spi/target/rabbitmq-event-listener.jar:/opt/keycloak/providers/rabbitmq-event-listener.jar
      - ./keycloak-config:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  #services
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: cinema-api-gateway
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ReverseProxy__Clusters__keycloak-cluster__Destinations__keycloak-1__Address=${KEYCLOAK_INTERNAL_URL}
      - ReverseProxy__Clusters__user-profile-cluster__Destinations__user-profile-1__Address=${IDENTITY_SERVICE_INTERNAL_URL}
      - ReverseProxy__Clusters__facility-cluster__Destinations__facility-1__Address=${FACILITY_SERVICE_INTERNAL_URL}
      - Jwt__Authority=${KC_AUTHORITY_URL}
      - UserProfileService__BaseUrl=${IDENTITY_SERVICE_INTERNAL_URL}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
    ports:
      - "${API_GATEWAY_PORT}:80"
    depends_on:
      - keycloak
      - identity-service
      - facility-service
      - redis
      
  identity-service:
    build:
      context: ../services/identity-service
      dockerfile: Dockerfile
    container_name: cinema-identity-service
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${USER_PROFILE_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__HostName=${RABBITMQ_HOST}
      - RabbitMQ__UserName=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${IDENTITY_SERVICE_PORT}:80"
    depends_on:
      - postgres
      - rabbitmq

  facility-service:
    build:
      context: ../services/facility-service
      dockerfile: Dockerfile
    container_name: cinema-facility-service
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ConnectionStrings__DefaultConnection=Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${FACILITY_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${FACILITY_SERVICE_PORT}:80"
    depends_on:
      - postgres

  

volumes:
  pgdata:
  redisdata: