name: cinema-backend-services

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cinema-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cinema
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cinema-rabbitmq-dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cinema-services

  catalog-db:
    image: postgres:16-alpine
    container_name: cinema-catalog-db
    environment:
      POSTGRES_DB: cinema_catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      # Host port 5433 avoids colliding with the legacy monolith DB on 5432.
      - "5433:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema_catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema-services

  catalog-service:
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    container_name: cinema-catalog-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/cinema_catalog_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-dev-internal-token}
      SHOWTIME_SERVICE_URL: http://showtime-service:8082
      OUTBOX_DISPATCHER_ENABLED: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cinema
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cinema-rabbitmq-dev}
    ports:
      - "8081:8081"
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cinema-services

  facility-db:
    image: postgres:16-alpine
    container_name: cinema-facility-db
    environment:
      POSTGRES_DB: cinema_facility_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5434:5432"
    volumes:
      - facility_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema_facility_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema-services

  facility-service:
    build:
      context: ..
      dockerfile: services/facility-service/Dockerfile
    container_name: cinema-facility-service
    environment:
      SERVER_PORT: 5002
      SPRING_DATASOURCE_URL: jdbc:postgresql://facility-db:5432/cinema_facility_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-dev-internal-token}
      SHOWTIME_SERVICE_URL: http://showtime-service:8082
    ports:
      - "5002:5002"
    depends_on:
      facility-db:
        condition: service_healthy
    networks:
      - cinema-services

  showtime-db:
    image: postgres:16-alpine
    container_name: cinema-showtime-db
    environment:
      POSTGRES_DB: cinema_showtime_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5435:5432"
    volumes:
      - showtime_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema_showtime_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema-services

  showtime-redis:
    image: redis:7-alpine
    container_name: cinema-showtime-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema-services

  showtime-service:
    build:
      context: ..
      dockerfile: services/showtime-service/Dockerfile
    container_name: cinema-showtime-service
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://showtime-db:5432/cinema_showtime_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      SPRING_DATA_REDIS_HOST: showtime-redis
      SPRING_DATA_REDIS_PORT: 6379
      CATALOG_SERVICE_URL: http://catalog-service:8081
      FACILITY_SERVICE_URL: http://facility-service:5002
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-dev-internal-token}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8082:8082"
    depends_on:
      catalog-service:
        condition: service_started
      facility-service:
        condition: service_started
      showtime-db:
        condition: service_healthy
      showtime-redis:
        condition: service_healthy
    networks:
      - cinema-services

  booking-db:
    image: postgres:16-alpine
    container_name: cinema-booking-db
    environment:
      POSTGRES_DB: cinema_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5436:5432"
    volumes:
      - booking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema_booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema-services

  booking-service:
    build:
      context: ..
      dockerfile: services/booking-service/Dockerfile
    container_name: cinema-booking-service
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/cinema_booking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      CATALOG_SERVICE_URL: http://catalog-service:8081
      FACILITY_SERVICE_URL: http://facility-service:5002
      SHOWTIME_SERVICE_URL: http://showtime-service:8082
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-dev-internal-token}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      OUTBOX_DISPATCHER_ENABLED: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cinema
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cinema-rabbitmq-dev}
    ports:
      - "8083:8083"
    depends_on:
      booking-db:
        condition: service_healthy
      catalog-service:
        condition: service_started
      facility-service:
        condition: service_started
      showtime-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - cinema-services

  analytics-db:
    image: postgres:16-alpine
    container_name: cinema-analytics-db
    environment:
      POSTGRES_DB: cinema_analytics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5437:5432"
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema_analytics_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema-services

  analytics-service:
    build:
      context: ..
      dockerfile: services/analytics-service/Dockerfile
    container_name: cinema-analytics-service
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://analytics-db:5432/cinema_analytics_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "123"
      SPRING_SQL_INIT_MODE: always
      ANALYTICS_READ_MODEL_ENABLED: "true"
      ANALYTICS_MESSAGING_ENABLED: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cinema
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cinema-rabbitmq-dev}
    ports:
      - "8084:8084"
    depends_on:
      analytics-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cinema-services

  neo4j:
    image: neo4j:5.23-community
    container_name: cinema-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-cinema_graph_2026}
      CINEMA_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cinema_graph_2026}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${CINEMA_NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - cinema-services

  recommendation-service:
    build:
      context: ..
      dockerfile: services/recommendation-service/Dockerfile
    container_name: cinema-recommendation-service
    environment:
      SERVER_PORT: 8085
      RECOMMENDATION_GRAPH_ENABLED: "true"
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:-cinema_graph_2026}
      RECOMMENDATION_MESSAGING_ENABLED: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: cinema
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cinema-rabbitmq-dev}
    ports:
      - "8085:8085"
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cinema-services

volumes:
  rabbitmq_data:
  catalog_db_data:
  facility_db_data:
  showtime_db_data:
  booking_db_data:
  analytics_db_data:
  neo4j_data:

networks:
  cinema-services:
    name: cinema-services
