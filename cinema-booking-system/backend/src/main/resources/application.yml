server:
server:
  port: 8080

spring:
  application:
    name: cinema-backend

  # ── PostgreSQL ──────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinema_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Redis ────────────────────────────────────────────────────
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      # password: your_redis_password   # uncomment if Redis requires auth
      timeout: 60000ms

# ── JWT ──────────────────────────────────────────────────────
app:
  jwt:
    secret: "${APP_JWT_SECRET:REPLACE_WITH_A_256_BIT_BASE64_ENCODED_SECRET_KEY_HERE}"
    expiration-ms: 86400000       # 1 day
    refresh-expiration-ms: 604800000  # 7 days
