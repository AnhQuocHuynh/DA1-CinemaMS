<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>The Digital Architect - QR Scanner</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error": "#ba1a1a",
              "primary-container": "#2563eb",
              "surface-container": "#e7eeff",
              "inverse-on-surface": "#ecf1ff",

              "on-secondary": "#ffffff",
              "inverse-primary": "#b4c5ff",
              "surface-dim": "#cfdaf2",
              "error-container": "#ffdad6",
              "secondary-container": "#d5e0f8",
              "secondary-fixed": "#d8e3fb",
              "on-tertiary-fixed": "#2a1700",
              "inverse-surface": "#263143",
              "on-primary-fixed-variant": "#003ea8",
              "on-surface": "#111c2d",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed": "#111c2d",
              "surface-container-low": "#f0f3ff",
              "on-error": "#ffffff",
              "surface-container-high": "#dee8ff",
              "tertiary-fixed": "#ffddb8",
              "secondary-fixed-dim": "#bcc7de",
              "primary-fixed-dim": "#b4c5ff",
              "on-secondary-container": "#586377",
              "secondary": "#545f73",
              "background": "#f9f9ff",
              "surface-container-highest": "#d8e3fb",
              "on-tertiary-fixed-variant": "#653e00",
              "on-primary-fixed": "#00174b",
              "on-primary": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "on-surface-variant": "#434655",
              "surface-variant": "#d8e3fb",
              "on-primary-container": "#eeefff",
              "outline": "#737686",
              "surface-bright": "#f9f9ff",
              "on-error-container": "#93000a",
              "surface": "#f9f9ff",
              "tertiary": "#784b00",
              "primary-fixed": "#dbe1ff",
              "on-tertiary-container": "#ffeedd",
              "surface-tint": "#0053db",
              "tertiary-container": "#996100",
              "on-secondary-fixed-variant": "#3c475a",
              "outline-variant": "#c3c6d7",
              "on-background": "#111c2d",
              "primary": "#004ac6"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .scan-frame-corner {
            width: 40px;
            height: 40px;
            border-color: #ffffff;
            position: absolute;
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #2563eb, transparent);
            box-shadow: 0 0 15px #2563eb;
            position: absolute;
            width: 100%;
            top: 0;
        }
        .tap-highlight-transparent {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-inverse-surface font-body text-on-surface select-none overflow-hidden">
<!-- Camera Viewport Emulation -->
<div class="fixed inset-0 z-0">
<img class="w-full h-full object-cover opacity-60 grayscale-[0.3]" data-alt="blurred POV of a crowded cinema lobby with movie posters and warm ambient lighting seen through a camera lens" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBWwnecwkr7A0LtQoAn3-AkTSJcCBwGvO_pBxjHjKTkR397sOHYD4kv4Wzmm0xxoQhKPCtBQY5rZ9xiCsdwtOCN1_JJ_6ehcMSpwkLFAFrFASc0JxBNBolipsx3rI5HAAeimpiPik5zOx1822IWTCNVs9b_s13Ii-FmXDwfS7ygg5I8NvxTwseIIz6k0zjXNJhjZWEKiH0TGm5BgaKF4mnOZppFHtsB6HCcLxdkCdzJArccv9QUNuXJLp1bS7WTG2maxWsrhK0QxB0"/>
<div class="absolute inset-0 bg-black/40"></div>
</div>
<!-- UI Overlay Layer -->
<div class="relative z-10 flex flex-col h-screen">
<!-- Header -->
<header class="p-6 pt-12 flex justify-between items-start">
<div>
<h1 class="text-white text-2xl font-bold tracking-tight">Scan Tickets</h1>
<p class="text-slate-300 text-sm font-medium mt-1 uppercase tracking-widest">Cinema 04 • Evening Show</p>
</div>
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white active:scale-90 transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Main Scanning Area -->
<main class="flex-grow flex flex-col items-center justify-center px-8">
<div class="relative w-full aspect-square max-w-[320px]">
<!-- Scanner Frame -->
<div class="absolute inset-0">
<div class="scan-frame-corner top-0 left-0 border-t-4 border-l-4 rounded-tl-xl"></div>
<div class="scan-frame-corner top-0 right-0 border-t-4 border-r-4 rounded-tr-xl"></div>
<div class="scan-frame-corner bottom-0 left-0 border-b-4 border-l-4 rounded-bl-xl"></div>
<div class="scan-frame-corner bottom-0 right-0 border-b-4 border-r-4 rounded-br-xl"></div>
</div>
<!-- Scanning Line -->
<div class="scan-line top-1/2"></div>
<!-- Focus Prompt -->
<div class="absolute -bottom-12 left-0 right-0 text-center">
<p class="text-white/80 text-sm font-medium tracking-wide">Align QR code within the frame</p>
</div>
</div>
</main>
<!-- Quick Controls -->
<div class="px-6 pb-24 grid grid-cols-2 gap-4">
<button class="bg-white/10 backdrop-blur-lg rounded-xl py-4 flex flex-col items-center gap-2 text-white active:bg-white/20 transition-all">
<span class="material-symbols-outlined text-3xl">flashlight_on</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Flash Off</span>
</button>
<button class="bg-white/10 backdrop-blur-lg rounded-xl py-4 flex flex-col items-center gap-2 text-white active:bg-white/20 transition-all">
<span class="material-symbols-outlined text-3xl">keyboard</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Manual Entry</span>
</button>
</div>
<!-- Result Toast (Success State Shown by Default for Demo) -->
<!-- In a real app, this would be hidden and triggered -->
<div class="fixed bottom-32 left-6 right-6 transform transition-all translate-y-0 opacity-100">
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-2xl flex items-center gap-4 border-l-4 border-primary">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex-grow">
<h3 class="text-on-surface font-bold text-lg leading-tight">Ticket Valid</h3>
<p class="text-on-surface-variant text-sm">Row H, Seat 12 • Premium</p>
</div>
<button class="text-primary font-bold text-xs uppercase tracking-tighter">Undo</button>
</div>
</div>
<!-- Invalid State Overlay (Hidden Context) -->
<div class="fixed inset-0 z-50 bg-error/90 flex flex-col items-center justify-center p-8 text-center hidden">
<span class="material-symbols-outlined text-8xl text-white mb-6">error</span>
<h2 class="text-white text-3xl font-black uppercase tracking-tighter mb-2">Invalid Ticket</h2>
<p class="text-white/80 text-lg mb-8">This ticket has already been scanned or is for a different session.</p>
<button class="w-full bg-white text-error font-bold py-4 rounded-xl text-lg uppercase tracking-widest active:scale-95 transition-all">
                Try Again
            </button>
</div>
<!-- Bottom Navigation Shell (Mobile Only) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-200/30">
<a class="flex flex-col items-center text-slate-400" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[10px] font-bold tracking-widest uppercase mt-1">Home</span>
</a>
<a class="flex flex-col items-center text-blue-700 bg-blue-50/50 rounded-lg py-1 px-3" href="#">
<span class="material-symbols-outlined" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="text-[10px] font-bold tracking-widest uppercase mt-1">Scan</span>
</a>
<a class="flex flex-col items-center text-slate-400" href="#">
<span class="material-symbols-outlined" data-icon="confirmation_number">confirmation_number</span>
<span class="text-[10px] font-bold tracking-widest uppercase mt-1">Tickets</span>
</a>
<a class="flex flex-col items-center text-slate-400" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[10px] font-bold tracking-widest uppercase mt-1">Profile</span>
</a>
</nav>
</div>
<!-- Haptic/Tap Areas for One-Handed Use -->
<div aria-hidden="true" class="fixed top-0 left-0 w-full h-24 z-20 tap-highlight-transparent"></div>
<div aria-hidden="true" class="fixed bottom-0 left-0 w-full h-48 z-20 tap-highlight-transparent"></div>
</body></html>
